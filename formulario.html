<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulário de Avaliação de Produto - WDD 131">
    <title>Avaliação de Produto | WDD 131</title>
    <link rel="stylesheet" href="estilos/formulario.css">
    <script src="scripts/formulario.js" defer></script>
</head>
<body>
    <header>
        <h1>Avaliação de Produto</h1>
    </header>

    <main>
        <p>Por favor, preencha o formulário abaixo para nos ajudar a melhorar nossos produtos.</p>
        
        <form method="get" action="avaliacao.html" class="wf1">
            
            <div class="form-item">
                <label for="produto">Nome do Produto <span class="required">*</span></label>
                <select id="produto" name="produto" required>
                    <option value="" disabled selected>Selecione um Produto...</option>
                </select>
            </div>

            <fieldset class="form-item rating-fieldset">
                <legend>Classificação Geral <span class="required">*</span></legend>
                <div class="rating">
                    <input type="radio" id="star5" name="classificacao" value="5" required>
                    <label for="star5" title="5 estrelas">&#9733;</label>
                    
                    <input type="radio" id="star4" name="classificacao" value="4" required>
                    <label for="star4" title="4 estrelas">&#9733;</label>
                    
                    <input type="radio" id="star3" name="classificacao" value="3" required>
                    <label for="star3" title="3 estrelas">&#9733;</label>
                    
                    <input type="radio" id="star2" name="classificacao" value="2" required>
                    <label for="star2" title="2 estrelas">&#9733;</label>
                    
                    <input type="radio" id="star1" name="classificacao" value="1" required>
                    <label for="star1" title="1 estrela">&#9733;</label>
                </div>
            </fieldset>

            <div class="form-item">
                <label for="data-instalacao">Data de Instalação <span class="required">*</span></label>
                <input type="date" id="data-instalacao" name="data-instalacao" required>
            </div>

            <fieldset class="form-item checkboxes">
                <legend>Quais recursos você achou úteis? (Marque todos que se aplicam)</legend>
                <label><input type="checkbox" id="recurso-durabilidade" name="recursos" value="durabilidade"> Durabilidade</label>
                <label><input type="checkbox" id="recurso-facilidade" name="recursos" value="facilidade_uso"> Facilidade de Uso</label>
                <label><input type="checkbox" id="recurso-desempenho" name="recursos" value="desempenho"> Desempenho</label>
                <label><input type="checkbox" id="recurso-design" name="recursos" value="design"> Design</label>
            </fieldset>

            <div class="form-item">
                <label for="avaliacao-texto">Avaliação Escrita (Opcional)</label>
                <textarea id="avaliacao-texto" name="avaliacao-texto" rows="4" placeholder="Conte-nos sobre sua experiência com o produto..."></textarea>
            </div>

            <div class="form-item">
                <label for="usuario">Seu Nome (Opcional)</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ex: João Silva">
            </div>

            <div class="form-item">
                <input type="submit" value="Enviar Avaliação" class="submitBtn">
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="anoAtual"></span> ✨ Caroline Marques Morais Cardoso ✨ Brasil </p>
        <p> Última modificação: <span id="ultimaModificacao"></span></p>
    </footer>
</body>
</html>
