<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Confirmação de Avaliação Enviada - WDD 131">
    <title>Obrigado pela Avaliação | WDD 131</title>
    <link rel="stylesheet" href="estilos/formulario.css">
    <script src="scripts/avaliacao.js" defer></script>
</head>
<body>
    <header>
        <h1>Avaliação de Produto</h1>
    </header>

    <main class="confirmation">
        <h2>Obrigado pelo seu feedback!</h2>
        <p>Sua avaliação de produto foi enviada com sucesso.</p>
        
        <div class="counter-box">
            <p>Você já enviou <strong id="review-count">0</strong> avaliação(ões) neste navegador.</p>
        </div>

        <a href="formulario.html" class="btn-back">Enviar Outra Avaliação</a>
    </main>

    <footer>
        <p>&copy; <span id="anoAtual"></span> ✨ Caroline Marques Morais Cardoso ✨ Brasil </p>
        <p> Última modificação: <span id="ultimaModificacao"></span></p>
    </footer>
</body>
</html>
